<ion-content class="ion-padding">
  <div class="modal-box">
    <div class="modal-header">
      <div class="header-title">Share note</div>
      <ion-icon name="close-outline" (click)="closeModal()" class="close-icon"></ion-icon>
    </div>

    <div class="modal-body">
      <div *ngIf="step == 1" style="padding: 5px;">

        <div class="header-container">
          <div class="left-section">
            <div class="logo-box">
              <img src="./assets/stellar-secret-icon.png" alt="icon" />
            </div>
            <span class="app-title">Stellar Secret</span>
          </div>
          <div class="right-section">
            <!-- <span class="info-icon"></span> -->
            <ion-icon class="info-icon" name="information-circle-outline"></ion-icon>
            <a href="#" class="how-it-works">How it works?</a>
          </div>
        </div>

        <p class="modal-title">
          Share your note as a secret message
        </p>
        <p class="modal-sub-title">
          Write and send message, it will be deleted once read.
        </p>
      </div>

      <ng-container *ngIf="step == 2">
        <div class="true-img-circle-container">
          <img src="./assets/true-circle.png" class="true-img-circle">
        </div>
        <p class="modal-title">Your note secret created. <br />Copy link or share it.</p>

        <div class="secret-link">{{ secretUrl }}</div>

        <ion-button expand="block" class="copy-btn" (click)="copyLink()">Copy</ion-button>
        <ion-button expand="block" class="share-btn" fill="outline" (click)="shareLink()">Share</ion-button>

        <div class="expires">
          <span class="text-muted">Expires:</span> {{ expiryText }}
        </div>

        <div class="burn-secret" (click)="burnSecret()">
          <img src="./assets/burn-icon.png" class="burn-img">
          <span class="text-danger">Burn Secret</span>
        </div>
      </ng-container>
    </div>

    <div class="modal-footer" *ngIf="step == 1">
      <ion-button expand="block" class="copy-btn" 
      (click)="creteSecret()" [disabled]="isLoading">Create Secret</ion-button>
    </div>
  </div>
</ion-content>
