<div class="editor-wrapper">
  <div id="custom-toolbar" class="toolbar" #toolbar>
    <button type="button" class="ql-undo">
    </button>

    <button type="button" class="ql-redo">
    </button>

    <div class="divider"></div>

    <button type="button" class="ql-bold">
    </button>

    <button class="ql-strike">
    </button>

    <div class="list-group">
      <button type="button" class="ql-list" value="bullet">
      </button>

      <button type="button" class="ql-list" value="ordered">
      </button>
    </div>

    <div class="header-pill" #headerPill>
      <select
        class="ql-header hidden-select"
        #headerSelect
        (change)="onHeaderChange($event)">
        <option value="false">{{'richTextStandard' | translate}}</option>
        <option value="1">{{'richTextHeading1' | translate}}</option>
        <option value="2">{{'richTextHeading2' | translate}}</option>
        <option value="3">{{'richTextHeading3' | translate}}</option>
        <option value="4">{{'richTextHeading4' | translate}}</option>
        <option value="5">{{'richTextHeading5' | translate}}</option>
        <option value="6">{{'richTextHeading6' | translate}}</option>
      </select>

      <button
        type="button"
        class="header-trigger"
        (click)="toggleDropdown($event)">
        <span class="selected-value">{{ getSelectedHeaderText() }}</span>
        <span class="dropdown-arrow">▼</span>
      </button>
    </div>

    <button class="ql-link">
    </button>

    <button class="ql-image">
    </button>
  </div>

  <quill-editor
    [(ngModel)]="note_text"
    (ngModelChange)="onContentChange($event)"
    [modules]="quillModules"
    (onEditorCreated)="onEditorCreated($event)"
    placeholder="{{'enterYourNoteHere' | translate}}">
  </quill-editor>
</div>

<ion-modal
  [isOpen]="imageViewerOpen"
  cssClass="note-image-viewer-modal"
  [backdropDismiss]="true"
  [showBackdrop]="true"
  (didDismiss)="closeImageViewer()">
  <ng-template>
    <ion-content class="image-viewer-content">
      <div class="image-viewer-shell">
        <div class="image-viewer-header">
          <ion-button fill="clear" class="image-viewer-close" (click)="closeImageViewer()">
            <ion-icon name="close"></ion-icon>
          </ion-button>

          <ion-button class="image-viewer-save" (click)="saveViewerImage()">
            <ion-icon name="download-outline" slot="start"></ion-icon>
            {{ allTranslations?.save ?? ('save' | translate) }}
          </ion-button>
        </div>

        <div class="image-viewer-body" (click)="closeImageViewer()">
          <div
            class="image-viewer-viewport"
            #viewerViewport
            (click)="$event.stopPropagation()"
            (wheel)="onViewerWheel($event)"
            (pointerdown)="onViewerPointerDown($event)"
            (pointermove)="onViewerPointerMove($event)"
            (pointerup)="onViewerPointerUp($event)"
            (pointercancel)="onViewerPointerUp($event)"
            (pointerleave)="onViewerPointerUp($event)">
            <img
              *ngIf="viewerImageSrc"
              #viewerImage
              [src]="viewerImageSrc"
              alt="Note image"
              class="image-viewer-preview"
              [style.transform]="getViewerTransform()" />
          </div>
        </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
