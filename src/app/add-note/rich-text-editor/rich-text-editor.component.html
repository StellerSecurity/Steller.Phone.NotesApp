<div class="editor-container" #editorWrapper>
  <!-- Custom Toolbar -->
  <div class="custom-toolbar">
    <!-- Undo/Redo -->
    <button class="toolbar-btn" (click)="undo()" title="Undo">
      <img class="icon-img" src="./assets/editor-icon/undo-icon.png" alt="Undo">
    </button>
    <button class="toolbar-btn" (click)="redo()" title="Redo">
      <img class="icon-img" src="./assets/editor-icon/undo-icon.png" alt="Redo" style=" transform: scaleX(-1);">
    </button>

    <!-- Text Formatting -->
    <button class="toolbar-btn" 
            [class.active]="isBold" 
            (click)="toggleBold()" 
            title="Bold">
      <img class="icon-img" src="./assets/editor-icon/bold-icon.png" alt="Bold">
    </button>
    <button class="toolbar-btn" 
            [class.active]="isStrikeThrough" 
            (click)="toggleStrikeThrough()" 
            title="Strikethrough">
      <img class="icon-img" src="./assets/editor-icon/strikethrough-icon.png" alt="Strikethrough">
    </button>

    <!-- Headings Dropdown -->
    <div class="dropdown">
      <button class="toolbar-btn" 
              [class.active]="isHeadingDropdownOpen || currentHeading" 
              (click)="toggleHeadingDropdown()" 
              title="Headings">
        <img class="icon-img" src="./assets/editor-icon/text-size-icon.png" alt="Headings">
        <span *ngIf="currentHeading" class="heading-indicator">{{currentHeading}}</span>
      </button>
      <div class="dropdown-menu" *ngIf="isHeadingDropdownOpen">
        <div (click)="applyHeading('H1')">Heading 1</div>
        <div (click)="applyHeading('H2')">Heading 2</div>
        <div (click)="applyHeading('H3')">Heading 3</div>
        <div (click)="applyHeading('H4')">Heading 4</div>
        <div (click)="applyHeading('H5')">Heading 5</div>
        <div (click)="applyHeading('P')">Normal Text</div>
      </div>
    </div>

    <!-- Lists -->
    <button class="toolbar-btn" 
            [class.active]="isListActive" 
            (click)="toggleBulletList()" 
            title="Bullet List">
      <img class="icon-img" src="./assets/editor-icon/tabler-list-icon.png" alt="Bullet List">
    </button>
    <button class="toolbar-btn" 
            [class.active]="isOrderedListActive" 
            (click)="toggleNumberedList()" 
            title="Numbered List">
      <img class="icon-img" src="./assets/editor-icon/numbers-icon.png" alt="Numbered List">
    </button>

    <!-- Media -->
    <button class="toolbar-btn" (click)="insertLink()" title="Insert Link">
      <img class="icon-img" src="./assets/editor-icon/tabler-icon-link.png" alt="Insert Link">
    </button>
    <button class="toolbar-btn" (click)="insertImage()" title="Insert Image">
      <img class="icon-img" src="./assets/editor-icon/photo-plus.png" alt="Insert Image">
    </button>
  </div>

  <!-- Editor -->
  <angular-editor
    #editorRef
    [config]="editorConfig"
    [(ngModel)]="note_text"
    (ngModelChange)="onContentChange($event)"
    (click)="updateToolbarState()"
    (keyup)="updateToolbarState()"
    (focus)="updateToolbarState()"
  ></angular-editor>
</div>
