<app-header title="My Notes" variant="primary">
  <ng-template headerActionbar>
    <button>
      <ion-icon
        slot="end"
        name="settings-outline"
        (click)="settings()"
        class="header-action-btn white"
      ></ion-icon>

      <ion-icon
        slot="end"
        name="ellipsis-vertical-outline"
        (click)="toggleCheckbox()"
        *ngIf="getNotes().length > 0"
        class="header-action-btn white"
      ></ion-icon>
    </button>
  </ng-template>
</app-header>

<ion-item class="bg-color-light" lines="none">
  <div class="note-search">
    <input placeholder="Search" (keyup)="onSearchChange($event)" [value]="search"/>
    <ion-icon
      name="search"
      src="assets/images/material-symbols-light_search.svg"
    ></ion-icon>
  </div>
</ion-item>
<ion-content class="ion-padding bg-color-light note-list">
  <p class="ion-padding" *ngIf="getNotes().length == 0">
    No notes has been created. Click on "+" to create a new note.
  </p>

  <note-list
    [notes]="getSearchResult()"
    [isCheckable]="checkboxOpened"
    (checkEvent)="handleCheckEvent($event)"
    (clickEvent)="handleClickNote($event)"
  />

  <ion-fab
    slot="fixed"
    vertical="center"
    horizontal="end"
    *ngIf="should_display"
  >
    <a routerLink="/note">
      <ion-img src="assets/images/add.png" alt="add" class="add"></ion-img>
    </a>
  </ion-fab>
</ion-content>

<ng-container *ngIf="!checkboxOpened; else selectFooter">
  <app-footer variant="light">
    <ng-template footerBefore>
      <note-button
        *ngIf="!appHasPasswordChallenge()"
        value="Add Notes App Passwordee"
        (clickEvent)="settings('addPassword')"
      />
    </ng-template>
  </app-footer>
</ng-container>

<note-confirm-modal
  [title]="deleteConfirm.title"
  [text]="deleteConfirm.text"
  [isOpen]="isDeleteModalOpen"
  (willDismiss)="onModalDismiss()"
>
  <ng-template confirmModalIcon>
    <ion-img src="assets/images/confirm-delete.svg"></ion-img>
  </ng-template>
  <ng-template confirmModalAction>
    <note-button
      [value]="deleteConfirm.button1.label"
      fill="outline"
      size="md"
      (clickEvent)="onDeleteConfirm(false)"
    ></note-button>
    <note-button
      [value]="deleteConfirm.button2.label"
      [color]="deleteConfirm.button2.color"
      size="md"
      (clickEvent)="onDeleteConfirm(true)"
    ></note-button>
  </ng-template>
</note-confirm-modal>

<!-- Unlock password -->
<ion-modal [isOpen]="!should_display" class="password">
  <ng-template>
    <ion-content class="ion-padding">
      <ion-list lines="none">
        <ion-item class="mb-12">
          <ion-label>
            <h4 class="password-title">
              <ion-text color="note-primary"> Unlock Notes App </ion-text>
            </h4>
            <p class="password-desc">
              <ion-text color="note-grey">
                Enter your password for the app to unlock your notes
              </ion-text>
            </p>
          </ion-label>
        </ion-item>

        <ion-item class="mb-2">
          <note-password-input
            placeholder="Enter your password"
            label="Password *"
            (keyupEvent)="ionInputAppUnlockInput($event)"
            (noteChangeEvent)="handleInputChange($event, 'password')"
          ></note-password-input>
        </ion-item>

        <ion-row class="forget-btn mb-10">
          <ion-button
            fill="clear"
            color="note-primary"
            (click)="resetPassword()"
            >Forgot Password</ion-button
          >
        </ion-row>

        <ion-item>
          <note-button value="Unlock App" (clickEvent)="unlockNotesApp()" />
        </ion-item>
      </ion-list>
    </ion-content>

    <app-footer></app-footer>
  </ng-template>
</ion-modal>

<ng-template #selectFooter>
  <app-footer variant="light">
    <ng-template footerBody>
      <ion-list lines="none" class="footer-action">
        <ion-item>
          <note-button
            color="note-danger"
            (clickEvent)="deleteSelectedNotes()"
            value="Delete Selected Notes"
          >
          </note-button>
        </ion-item>
        <ion-item>
          <note-button
            color="note-primary"
            (clickEvent)="toggleCheckbox()"
            value="Cancel"
          >
          </note-button>
        </ion-item>
      </ion-list>
    </ng-template>
  </app-footer>
</ng-template>
