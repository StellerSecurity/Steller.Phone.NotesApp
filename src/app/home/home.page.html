<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Steller Notes ({{getNotes().length}})
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-fab slot="fixed"  vertical="bottom" horizontal="end">
  <ion-fab-button routerLink="/note">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let note of getNotes()"  [routerLink]="'/note/' + note.id" [detail]="false">
      <ion-label class="ion-text-wrap ion-padding">
        <h2>
          <span *ngIf="note.protected">PROTECTED <ion-icon name="lock-closed"></ion-icon></span>
          <span class="date">
        <ion-note>{{ note.last_modified | date: "yyyy-MM-dd H:mm":"UTC" }}</ion-note>
      </span>
        </h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
