<app-header title="My Notes" variant="primary">
  <ng-template headerActionbar>
    <button>
      <ion-icon
        slot="end"
        name="settings-outline"
        (click)="settings()"
        class="header-action-btn white"
      ></ion-icon>
      <ion-icon
        slot="end"
        name="ellipsis-vertical-outline"
        (click)="toggleCheckbox()"
        *ngIf="getNotes().length > 0"
        class="header-action-btn white"
      ></ion-icon>
    </button>
  </ng-template>
</app-header>

<ion-item class="bg-color-light" lines="none">
  <div class="note-search">
    <input placeholder="Search"/>
    <ion-icon
      name="search"
      src="assets/images/material-symbols-light_search.svg"
    ></ion-icon>
  </div>
</ion-item>
<ion-content class="ion-padding bg-color-light note-list">
  <p class="ion-padding" *ngIf="getNotes().length == 0">
    No notes has been created. Click on "+" to create a new note.
  </p>

  <note-list [notes]="getNotes()" />

  <ion-fab
    slot="fixed"
    vertical="center"
    horizontal="end"
    *ngIf="should_display"
  >
    <a routerLink="/note">
      <ion-img src="assets/images/add.png" alt="add" class="add"></ion-img>
    </a>
  </ion-fab>
</ion-content>

<app-footer variant="light">
  <ng-template footerBefore>
    <note-button
      *ngIf="!appHasPasswordChallenge()"
      value="Add Notes App Passwordee"
      (onClick)="settings('addPassword')"
    />
  </ng-template>
</app-footer>

<!-- modal ask for password -->
<ion-modal trigger="app-ask-password" [isOpen]="!should_display">
  <ng-template>
    <ion-content class="ion-padding">
      <div align="center"><h2>Stellar Notes</h2></div>
      <p>Enter your password to get access to your notes.</p>
      <ion-item>
        <ion-input
          type="password"
          placeholder="Enter your password"
          (keyup)="ionInputAppUnlockInput($event)"
          [(ngModel)]="input_password_app_unlock"
          autofocus="true"
        ></ion-input>
      </ion-item>
      <ion-button color="primary" expand="full" (click)="unlockNotesApp()"
        >Unlock App</ion-button
      >
      <br /><br />
    </ion-content>

    <ion-footer>
      <ion-button color="danger" expand="full" (click)="resetPassword()"
        >Reset Password</ion-button
      >
    </ion-footer>
  </ng-template>
</ion-modal>

<ion-toolbar
  slot="fixed"
  class="toolbar-bottom"
  *ngIf="checkboxOpened && getNotes().length > 0"
>
  <ion-button color="danger" expand="full" (click)="deleteSelectedNotes()"
    >Delete Selected Notes</ion-button
  ><br />
  <ion-button color="primary" expand="full" (click)="toggleCheckbox()"
    >Cancel</ion-button
  >
</ion-toolbar>
