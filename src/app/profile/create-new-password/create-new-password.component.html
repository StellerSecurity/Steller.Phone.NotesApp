<ion-content class="ion-padding user-account-section-container" scroll-y="false">
  <div class="user-account-section">
    <!-- Top Logo Area -->
    <div class="top-section">
      <div class="logo-container">
        <img class="login-app-logo-img" src="./assets/note-logo-white-bg.png" alt="">
        <div class="app-name">Stellar Private Notes</div>
      </div>
    </div>

    <!-- White Card with Fields -->
    <div class="form-card">
      <div class="form-card-content">
        <ion-button fill="clear" size="small" class="back-button" (click)="backToLogin()">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </ion-button>

        <div class="title">Create new password</div>
        <p class="subtitle">Create new password for your account</p>

        <ion-item class="input-field" lines="none">
          <ion-input placeholder="New Password" [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword"
            lines="none" shape="round">
          </ion-input>
          <ion-icon slot="end" [name]="showNewPassword ? 'eye-off' : 'eye'" class="password-toggle"
            (click)="toggleNewPasswordVisibility()">
          </ion-icon>
        </ion-item>

        <ion-item class="input-field" lines="none">
          <ion-input placeholder="Confirm New Password" [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword" lines="none" shape="round">
          </ion-input>
          <ion-icon slot="end" [name]="showConfirmPassword ? 'eye-off' : 'eye'" class="password-toggle"
            (click)="toggleConfirmPasswordVisibility()">
          </ion-icon>
        </ion-item>

        <ion-button class="confirm-button" (click)="confirm()">Confirm</ion-button>
      </div>
    </div>
  </div>
</ion-content>
