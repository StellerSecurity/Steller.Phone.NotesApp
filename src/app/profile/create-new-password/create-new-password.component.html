<ion-content class="user-account-section">
  <!-- Top Logo Area -->
  <div class="top-section">
    <div class="logo-container">
      <ion-icon name="document-text-outline" class="app-logo"></ion-icon>
      <h1 class="app-name">Stellar Notes</h1>
    </div>
  </div>

  <!-- White Card with Fields -->
  <div class="form-card">
    <ion-button fill="clear" size="small" class="back-button" (click)="backToLogin()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>

    <h2 class="title">Create new password</h2>
    <p class="subtitle">Create new password for your account</p>

    <ion-item class="input-field" lines="none">
      <ion-input
        placeholder="New Password"
        [type]="showNewPassword ? 'text' : 'password'"
        [(ngModel)]="newPassword"
        fill="solid">
      </ion-input>
      <ion-icon
        slot="end"
        [name]="showNewPassword ? 'eye-off-outline' : 'eye-outline'"
        class="password-toggle"
        (click)="toggleNewPasswordVisibility()">
      </ion-icon>
    </ion-item>

    <ion-item class="input-field" lines="none">
      <ion-input
        placeholder="Confirm New Password"
        [type]="showConfirmPassword ? 'text' : 'password'"
        [(ngModel)]="confirmPassword"
        fill="solid">
      </ion-input>
      <ion-icon
        slot="end"
        [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"
        class="password-toggle"
        (click)="toggleConfirmPasswordVisibility()">
      </ion-icon>
    </ion-item>

    <ion-button expand="block" class="confirm-button" (click)="confirm()">Confirm</ion-button>
  </div>
</ion-content>
