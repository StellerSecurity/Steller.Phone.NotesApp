<ion-content class="create-account-content">

  <!-- Top Blue Section -->
  <div class="top-section">
    <div class="logo-container">
      <ion-icon name="document-text-outline" class="app-logo"></ion-icon>
      <h1 class="app-name">Stellar Notes</h1>
    </div>
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <ion-button fill="clear" size="small" class="back-button" routerLink="/login">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>

    <h2 class="title">Create an account</h2>
    <p class="subtitle">Please enter email and password to create your free account.</p>

    <ion-item class="input-field" lines="none">
      <ion-input [(ngModel)]="email" placeholder="Email" type="email" fill="solid"></ion-input>
    </ion-item>

    <ion-item class="input-field" lines="none">
      <ion-input
        [(ngModel)]="password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        fill="solid">
      </ion-input>
      <ion-icon
        name="{{ showPassword ? 'eye-off-outline' : 'eye-outline' }}"
        slot="end"
        class="password-toggle"
        (click)="togglePasswordVisibility()">
      </ion-icon>
    </ion-item>

    <ion-button expand="block" class="create-button" (click)="createAccount()">
      Create Account
    </ion-button>

    <div class="footer">
      <span>Already have an account? </span>
      <a (click)="goToLogin()">Log in</a>
    </div>
  </div>

</ion-content>
