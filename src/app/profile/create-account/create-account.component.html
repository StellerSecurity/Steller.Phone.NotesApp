<ion-content class="ion-padding user-account-section-container" scroll-y="false">
  <div class="user-account-section">
    <!-- Top Logo Section -->
    <div class="top-section">
      <div class="logo-container">
        <img class="login-app-logo-img" src="./assets/note-logo-white-bg.png" alt="">
        <div class="app-name">Stellar Private Notes</div>
      </div>
    </div>

    <!-- FORM SECTION -->
    <div class="form-card" *ngIf="!showVerificationSection">
      <ion-button fill="clear" size="small" class="back-button" routerLink="/profile/login">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>

      <div class="form-card-content">
        <div class="title">Create an account</div>
        <p class="subtitle">Please enter email and password to create your free account.</p>

        <ion-item class="input-field" lines="none">
          <ion-input [(ngModel)]="email" placeholder="Email" type="email" lines="none" shape="round"></ion-input>
        </ion-item>

        <ion-item class="input-field" lines="none">
          <ion-input [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" placeholder="Password"
            lines="none" shape="round">
          </ion-input>
          <ion-icon name="{{ showPassword ? 'eye-off-outline' : 'eye-outline' }}" slot="end" class="password-toggle"
            (click)="togglePasswordVisibility()">
          </ion-icon>
        </ion-item>

        <ion-button class="create-button" (click)="createAccount()">
          Create Account
        </ion-button>

        <div class="footer">
          <span class="label-beforee-link">Already have an account? </span>
          <a (click)="goToLogin()">Log in</a>
        </div>
      </div>
    </div>

    <!-- VERIFICATION SECTION -->
    <div class="form-card" *ngIf="showVerificationSection">
      <div class="form-card-content">
        <div class="verify-icon">
          <!-- <ion-icon name="mail-outline" class="mail-icon"></ion-icon> -->
          <img src="./assets/tabler-icon-mail-forward.png" width="40" height="40">
        </div>
        <div class="title" style="margin-top: 14px;">Please input code</div>
        <p class="subtitle">We sent an account verification code to <br /><strong>{{ email }}</strong></p>

        <div class="code-input-wrapper">
          <ng-otp-input (onInputChange)="onOtpChange($event)" [config]="otpConfig" containerClass="ng-ong-otp-box">
          </ng-otp-input>
        </div>

        <div class="resend-section">
          Don’t receive a code?
          <a (click)="resendCode()">Resend code</a>
        </div>

        <div class="footer">
          <div class="change-email">
            <a (click)="changeEmail()">Sign up with different email</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
