<ion-content class="user-account-section">
  <!-- Top Logo Section -->
  <div class="top-section">
    <div class="logo-container">
      <ion-icon name="document-text-outline" class="app-logo"></ion-icon>
      <h1 class="app-name">Stellar Notes</h1>
    </div>
  </div>

  <!-- FORM SECTION -->
  <div class="form-card" *ngIf="!showVerificationSection">
    <ion-button fill="clear" size="small" class="back-button" routerLink="/profile/login">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>

    <h2 class="title">Create an account</h2>
    <p class="subtitle">Please enter email and password to create your free account.</p>

    <ion-item class="input-field" lines="none">
      <ion-input [(ngModel)]="email" placeholder="Email" type="email" fill="solid"></ion-input>
    </ion-item>

    <ion-item class="input-field" lines="none">
      <ion-input
        [(ngModel)]="password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        fill="solid">
      </ion-input>
      <ion-icon
        name="{{ showPassword ? 'eye-off-outline' : 'eye-outline' }}"
        slot="end"
        class="password-toggle"
        (click)="togglePasswordVisibility()">
      </ion-icon>
    </ion-item>

    <ion-button expand="block" class="create-button" (click)="createAccount()">
      Create Account
    </ion-button>

    <div class="footer">
      <span>Already have an account? </span>
      <a (click)="goToLogin()">Log in</a>
    </div>
  </div>

  <!-- VERIFICATION SECTION -->
  <div class="form-card" *ngIf="showVerificationSection">
    <div class="verify-icon">
      <ion-icon name="mail-outline" class="mail-icon"></ion-icon>
    </div>
    <h2 class="title">Please input code</h2>
    <p class="subtitle">We sent an account verification code to <br /><strong>{{ email }}</strong></p>

    <div class="code-input-wrapper">
      <input
          maxlength="1"
          *ngFor="let code of verificationCode; let i = index"
          [(ngModel)]="verificationCode[i]"
          (input)="handleCodeInput($event, i)"
          (keydown)="handleKeyDown($event, i)" />

    </div>

    <div class="resend-section">
      Don’t receive a code?
      <a (click)="resendCode()">Resend code</a>
    </div>

    <div class="change-email">
      <a (click)="changeEmail()">Sign up with different email</a>
    </div>
  </div>
</ion-content>
