<ion-content class="forgot-password-content">
  <div class="top-section">
    <div class="logo-container">
      <ion-icon name="document-text-outline" class="app-logo"></ion-icon>
      <h1 class="app-name">Stellar Notes</h1>
    </div>
  </div>

  <!-- EMAIL FORM -->
  <div class="form-card" *ngIf="!showVerification">
    <ion-button fill="clear" size="small" class="back-button" routerLink="/login">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>

    <h2 class="title">Forgot Password</h2>
    <p class="subtitle">Please enter email to receive verification code</p>

    <ion-item class="input-field" lines="none">
      <ion-input [(ngModel)]="email" placeholder="Email" fill="solid"></ion-input>
    </ion-item>

    <ion-button expand="block" class="confirm-button" (click)="sendCode()">Send Code</ion-button>
  </div>

  <!-- CODE INPUT FORM -->
  <div class="form-card" *ngIf="showVerification">
    <div class="verify-icon">
      <ion-icon name="mail-outline" class="mail-icon"></ion-icon>
    </div>

    <h2 class="title">Please input code</h2>
    <p class="subtitle">
      We sent a code to <br /><strong>{{ email }}</strong>
    </p>

    <div class="code-input-wrapper">
      <input maxlength="1" *ngFor="let code of verificationCode; let i = index"
             [(ngModel)]="verificationCode[i]"
             (input)="handleCodeInput($event, i)"
             (keydown)="handleKeyDown($event, i)" />
    </div>

    <div class="resend-section">
      Don’t receive a code? <a (click)="resendCode()">Resend code</a>
    </div>

    <div class="change-email">
      <a (click)="useDifferentEmail()">Use different email</a>
    </div>
  </div>
</ion-content>
