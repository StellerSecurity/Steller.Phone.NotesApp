<ion-content class="forgot-password-content">
  <!-- Top Blue Section with Logo -->
  <div class="top-section">
    <div class="logo-container">
      <ion-icon name="document-text-outline" class="app-logo"></ion-icon>
      <h1 class="app-name">Stellar Notes</h1>
    </div>
  </div>

  <!-- Form Card -->
  <div class="form-card">
    <ion-button fill="clear" size="small" class="back-button" (click)="backToLogin()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>

    <h2 class="title">Forgot Password</h2>
    <p class="subtitle">Please enter email to receive verification code</p>

    <ion-item class="input-field" lines="none">
      <ion-input [(ngModel)]="email" placeholder="Email" type="email" fill="solid"></ion-input>
    </ion-item>

    <ion-button expand="block" class="send-button" (click)="sendCode()">Send Code</ion-button>
  </div>
</ion-content>
