<ion-content class="user-account-section">
  <!-- Top Blue Section with Logo -->
  <div class="top-section">
    <div class="logo-container">
        <img class="login-app-logo-img" src="./assets/note-logo-white-bg.png" alt="">
        <div class="app-name">Stellar Private Notes</div>
    </div> 
  </div>

  <!-- White Card Login Form -->
  <div class="form-card">
    <div class="title">Log In</div>
    <p class="subtitle">Please enter your email and password</p>

    <ion-item class="input-field" lines="none">
      <ion-input 
        [(ngModel)]="email" 
        placeholder="Email"
        type="email"
        lines="none" 
        shape="round"
      >
      </ion-input>
    </ion-item>

    <ion-item class="input-field" lines="none">
      <ion-input
        [(ngModel)]="password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        lines="none" 
        shape="round"
        >
      </ion-input>
      <ion-icon
        name="{{ showPassword ? 'eye-off' : 'eye' }}"
        slot="end"
        class="password-toggle"
        (click)="togglePasswordVisibility()">
      </ion-icon>
    </ion-item>

    <div class="forgot-password" (click)="forgotPassword()">Forgot Password?</div>

    <ion-button class="login-button" (click)="login()">Log In</ion-button>

    <div class="footer">
      <span class="label-beforee-link">Don’t have an account? </span>
      <a (click)="navigateToRegister()">Create an Account</a>
    </div>
  </div>
</ion-content>
