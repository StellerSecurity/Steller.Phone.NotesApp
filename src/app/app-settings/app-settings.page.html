        <ion-list lines="none">
          <ion-item>
            <ion-label>
              <h4 class="password-title">
                <ion-text color="note-primary">
                  Secure your Note with a password
                </ion-text>
              </h4>
              <p class="password-desc">
                <ion-text color="note-grey">
                  Secure your Notes with encryption
                </ion-text>
              </p>
            </ion-label>
          </ion-item>

          <ion-item>
            <note-password-input
              placeholder="Enter your password"
              label="New Password *"
              variant="strength"
              class="new-password"
            ></note-password-input>
          </ion-item>

          <ion-item>
            <note-password-input
              placeholder="Enter your password"
              label="Confirm Password *"
              class="confirm-password"
            ></note-password-input>
          </ion-item>

          <ion-item>
            <note-button value="Set New Password" (clickEvent)="save()" />
          </ion-item>
        </ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>

  <ion-list>
    <note-setting-card
      title="Ask For Password"
      content="When open App you need enter your password."
      [status]="appPasswordChallenge"
      (statusChangeEvent)="appPasswordChallengeDialog($event)"
    >
    </note-setting-card>
    <note-setting-card
      title="Wipe Note Data"
      content="Wipe notes will delete ALL notes on your phone if you enter the password for the app wrongly 20 times in a row. It cannot be turned off."
      (statusChangeEvent)="null"
    >
    </note-setting-card>
  </ion-list>

<app-footer>
  <ng-template footerBody>
    <note-button
      color="note-danger"
      expand="full"
      (clickEvent)="deleteWholeAppStorage()"
      value="Delete All Notes"
    ></note-button>
  </ng-template>
</app-footer>
