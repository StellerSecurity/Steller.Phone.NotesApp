<app-header
  title="Settings"
  variant="primary"
  [backButton]="true"
  (backClickEvent)="handleOnBack()"
>
</app-header>

<ion-content>
  <!-- Set Password Modal For App -->
  <ion-modal #modal trigger="open-modal">
    <ng-template>
      <ion-content class="ion-padding" *ngIf="tempPasswordChallenge">
        <ion-list lines="none">
          <ion-item>
            <ion-label>
              <h4 class="password-title">
                <ion-text color="note-primary">
                  Set Password For The App
                </ion-text>
              </h4>
              <p class="password-desc">
                <ion-text color="note-grey">
                  Secure your Notes data with encryption
                </ion-text>
              </p>
            </ion-label>
          </ion-item>

          <ion-item>
            <note-password-input
              placeholder="Enter your password"
              label="New Password *"
              variant="strength"
              class="new-password"
              (noteChangeEvent)="handleInputChange($event, 'password')"
            ></note-password-input>
          </ion-item>

          <ion-item>
            <note-password-input
              placeholder="Enter your password"
              label="Confirm Password *"
              class="confirm-password"
              (noteChangeEvent)="handleInputChange($event, 'confirm-password')"
            ></note-password-input>
          </ion-item>

          <ion-item class="mb-4">
            <note-button value="Set New Password" (clickEvent)="save()" />
          </ion-item>
          <ion-item>
            <note-button value="Cancel" (clickEvent)="cancel()" fill="outline" ></note-button>
          </ion-item>
        </ion-list>
      </ion-content>
      <ion-content class="ion-padding" *ngIf="!tempPasswordChallenge">
        <ion-list lines="none">
          <ion-item class="mb-12">
            <ion-label>
              <h4 class="password-title">
                <ion-text color="note-primary">Remove Password</ion-text>
              </h4>
              <p class="password-desc">
                <ion-text color="note-grey">
                  Enter your password for the app to remove password
                </ion-text>
              </p>
            </ion-label>
          </ion-item>

          <ion-item class="mb-10">
            <note-password-input
              placeholder="Enter your password"
              label="Password *"
              class="mb-2"
              (noteChangeEvent)="handleInputChange($event, 'confirm-password')"
            ></note-password-input>
          </ion-item>

          <ion-item class="mb-4">
            <note-button value="Remove Password" (clickEvent)="save()" />
          </ion-item>
          <ion-item>
            <note-button value="Cancel" (clickEvent)="cancel()" fill="outline" />
          </ion-item>
        </ion-list>
      </ion-content>
      <app-footer></app-footer>
    </ng-template>
  </ion-modal>

  <ion-list>
    <note-setting-card
      title="Ask For Password"
      content="When notes is launched it will require a password you set."
      [status]="appPasswordChallenge"
      (statusChangeEvent)="appPasswordChallengeDialog($event)"
    >
    </note-setting-card>
    <note-setting-card
      title="Protection"
      content="Protection will delete ALL notes on your phone if you enter the password for the app wrongly 20 times in a row. It cannot be turned off, if password for the app is enabled."
      [status]="appPasswordChallenge"
    >
    </note-setting-card>
  </ion-list>
</ion-content>

<app-footer>
  <ng-template footerBody>
    <note-button
      color="note-danger"
      expand="full"
      (clickEvent)="deleteWholeAppStorage()"
      value="Delete All Notes"
    ></note-button>
  </ng-template>
</app-footer>
