<div class="confirmation-modal">
  <img src="../../assets/delete.png" class="burn-img" alt="">
  <h2>Delete Notes</h2>
  <p>Please confirm if you want to delete all your notes. They cant be recovered.</p>
  <div class="buttons">
    <p class="blue-btn transparent-btn" (click)="dismiss(false)">Cancel</p>
    <p class="blue-btn" (click)="dismiss(true)">Delete</p>
  </div>
</div>
