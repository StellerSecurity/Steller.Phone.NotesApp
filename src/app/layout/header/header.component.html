<ion-header [translucent]="true" [class]="className">
  <ion-toolbar [class]="className">
    <ng-container
      [ngTemplateOutlet]="backBtn?.templateRef || defaultBackButton"
    ></ng-container>
    <ion-title> {{ title }} </ion-title>

    <ion-buttons slot="end">
      <ng-container
        [ngTemplateOutlet]="actionBar?.templateRef || null"
      ></ng-container>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ng-template #defaultBackButton>
  <ng-container *ngIf="backButton">
    <ion-buttons slot="start">
      <ion-button
        (click)="handleBackButtonClick()"
        class="back-btn"
        fill="clear"
      >
        <ion-img src="assets/images/header-back-button.svg"></ion-img>
      </ion-button>
    </ion-buttons>
  </ng-container>
</ng-template>
