apply plugin: 'com.android.application'

// Recovery is opt-in; ordinary app builds retain their existing launcher and behavior.
def notesRecoveryExport = project.findProperty('notesRecoveryExport') == 'true'

android {
    namespace "Steller.Phone.NotesApp"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "steller.phone.notesapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode notesRecoveryExport ? 48 : 47
        versionName notesRecoveryExport ? "2.92-recovery" : "2.91"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets.main.manifest.srcFile notesRecoveryExport ? 'src/recovery/AndroidManifest.xml' : 'src/main/AndroidManifest.xml'
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

apply from: 'release-tests.gradle'

// The actual packaged manifest must remain offline and recovery-only.
if (notesRecoveryExport) {
    def recoveryCompiledCheck = tasks.register('verifyRecoveryApk', Exec) {
        group = 'verification'
        dependsOn 'packageRelease'
        workingDir rootProject.projectDir.parentFile
        def configFile = new File(rootProject.projectDir.parentFile, 'release-tests.local.json')
        def config = configFile.exists() ? new groovy.json.JsonSlurper().parse(configFile) : [:]
        def aaptName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'aapt.exe' : 'aapt'
        def aaptPath = new File(android.sdkDirectory, 'build-tools/' + android.buildToolsVersion + '/' + aaptName)
        commandLine(System.getenv('STELLAR_NODE_BINARY') ?: config.nodeBinary ?: 'node',
            'scripts/recovery/verify-recovery-apk.cjs', aaptPath.absolutePath,
            layout.buildDirectory.dir('outputs/apk/release').get().asFile.absolutePath)
    }
    tasks.configureEach { task ->
        if (task.name in ['assembleRelease', 'bundleRelease']) task.dependsOn(recoveryCompiledCheck)
    }
}
